      proposedBy: planner/inline-plan-draft@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    spec:
      rationale: |
        Optimize the explicit experimental Workflow A lifecycle before using it
        for broader AHRA adoption work. The recent Workflow A dogfood run proved
        that raw Gate 2 artifacts are too machine-facing for human approval and
        that RequestDraftAdmission failures can appear after cross-alignment has
        passed. This GoalExecutionRequest is the Workflow B entry request for
        that optimization. It must not promote Workflow A to the default route,
        must not change Workflow B execution semantics, and must not start the
        previously frozen adoption-model request.
      nodes:
        - id: NODE-workflow-a-human-gates-optimization
          nodeType: bounded_task
          objective: |
            Continuation instruction for this run: reuse the previous Workflow B
            output instead of re-implementing from scratch. Start by applying
            the prior rejected patch at 'E:\ahra-v0.1-starter\artifacts\workflow-a-optimization-plan\20260708T000000-0700\workflow-b-run\artifacts\bounded-task-executor\tasks\workflow-a-human-gates-optimization\rejected.patch'. It has already been checked
            with git apply --check against HEAD 37722a6 and applies cleanly.
            Use the prior work report and deterministic evidence as context,
            then run the required verification commands. Only make additional
            edits if the patch application or checks reveal a real defect.
            Implement a Workflow A usability and admission-hardening increment.
            Required behavior:
            1) Add an automatic self-contained HTML Gate 2 briefing generated
            from RequestDraft and ApprovalRecord inputs. The briefing must show
            request id, approval id, request/plan digests, current status, next
            safe command, allowed write scope, explicitly unauthorized scope,
            plan node summary, claim coverage summary, non-goals, and a visible
            human checklist. The HTML must escape dynamic text and use no
            external scripts, remote assets, or network dependencies.
            2) Bind Gate 2 authorization to that briefing in strict mode by
            verifying request id, approval id, and request digest. The HTML is a
            human briefing artifact only; ApprovalRecord and GoalExecutionRequest
            remain the machine authorities.
            3) Add a human-readable Workflow A status surface that reports the
            current stage, request/approval/briefing/request-output paths when
            known, the next safe action, and whether Workflow B has started.
            4) Represent unresolved Gate 1 choices as structured decision records
            with decision id, question, recommendation, alternatives,
            consequences, blocking flag, and final answer. Gate 1 must not
            freeze while blocking decisions remain unanswered.
            5) Formalize admission-aware drafting so Acceptance and Requirement
            agents receive registered node types, gate refs, runtime refs,
            allowed capabilities, and budget rules before drafting. Human
            approval must be represented as approvalRequired rather than invented
            HumanGate refs.
            6) Run RequestDraftAdmission after cross-alignment and before Gate 2
            approval creation. If admission rejects and attempts remain, feed the
            structured rejection report back into a bounded redraft. If attempts
            are exhausted, persist the failure and do not write approval.json.
            7) Update the relevant docs and component inventory without changing
            Workflow A's experimental/non-default lifecycle classification.
            Verification must include focused unit/CLI coverage and at least
            uv run python -B scripts/check.py, then record the commands in the
            WorkReport.verification_commands_run field.
