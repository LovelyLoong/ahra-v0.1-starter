apiVersion: ahra.dev/v1alpha1
kind: RuntimeProfile
metadata:
  name: repo-container
  version: 0.1.0
spec:
  providerClass: oci-container
  image: registry.example/agent-runtime@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  user: "10001:10001"
  filesystem:
    root: read_only
    writableMounts:
      - name: workspace
        path: /workspace
    deniedPaths:
      - /var/run/docker.sock
      - /home/host
  network:
    default: deny
    allow:
      - host: api.model-gateway.internal
        ports: [443]
  resources:
    cpu: "2"
    memoryMiB: 4096
    ephemeralDiskMiB: 10240
    processLimit: 256
  timeoutSeconds: 1800
  snapshot:
    enabled: true
  secrets:
    injection: short_lived_files
    persistInSnapshot: false
