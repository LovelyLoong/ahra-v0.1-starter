apiVersion: ahra.dev/v1alpha1
kind: GoalExecutionRequest
metadata:
  name: m1-command-gate-demonstration
  requestId: GREQ-M1-COMMAND-GATE-DEMO
  idempotencyKey: m1-command-gate-demonstration-001
spec:
  profileRef: profile/m1-deterministic@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  workspaceRef: workspace
  artifactDir: .ahra/artifacts
  store:
    kind: sqlite
    path: .ahra/goal-control.sqlite3
  planner:
    adapterRef: planner/inline-plan-draft@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  executor:
    adapterRef: executor/deterministic-file-effect@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
  gateRunner:
    adapterRef: gate-runner/command@sha256:5555555555555555555555555555555555555555555555555555555555555555
  runtime:
    runtimeRef: runtime/local-goal@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
    digest: sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
  goal:
    goalRef: GOAL-M1-COMMAND-GATE-DEMO
    goalDigest: sha256:5555555555555555555555555555555555555555555555555555555555555555
    claimGraphRef: claim-graph/m1-command-gate-demo
    claimGraphDigest: sha256:6666666666666666666666666666666666666666666666666666666666666666
    requiredClaimRefs:
      - CLM-WRITE-ARTIFACT
      - CLM-COMMAND-GATE
      - CLM-GOAL-COMPLETE
  registry:
    nodeTypes:
      bounded_task: sha256:1111111111111111111111111111111111111111111111111111111111111111
      gate_verification: sha256:9999999999999999999999999999999999999999999999999999999999999999
      goal_verification: sha256:2222222222222222222222222222222222222222222222222222222222222222
    gateRefs:
      GATE-write-artifact: sha256:3333333333333333333333333333333333333333333333333333333333333333
      GATE-command-sentinel: sha256:e650077f6c8bc828d73913d3b65e95e161cee148bbcdbaa4a7db2037402774b8
      GATE-goal-complete: sha256:4444444444444444444444444444444444444444444444444444444444444444
    gateDefinitions:
      - apiVersion: ahra.dev/v1alpha1
        kind: GateDefinition
        metadata:
          name: command-sentinel
          gateId: GATE-command-sentinel
          version: 1
        spec:
          level: L1
          evidenceKind: contract_test
          verifierMode: command
          riskLevel: R1
          subjectKinds:
            - workspace_file
          command:
            - python
            - -c
            - 'from pathlib import Path; path = Path("inputs/command-gate.txt"); text = path.read_text(encoding="utf-8").strip() if path.exists() else ""; print("COMMAND_GATE_OK" if text == "fixed" else "COMMAND_GATE_BAD:" + (text or "missing")); raise SystemExit(0 if text == "fixed" else 1)'
          expectation:
            expectedExitCode: 0
            outputMatch:
              stream: combined
              contains: COMMAND_GATE_OK
    runtimeRefs:
      runtime/local-goal@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee: sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
    allowedCapabilities:
      - filesystem.write
      - process.exec
  execution:
    maxRepairCycles: 0
    maxConcurrency: 1
    branch: main
  planDraft:
    apiVersion: ahra.dev/v1alpha1
    kind: PlanDraft
    metadata:
      goalId: GOAL-M1-COMMAND-GATE-DEMO
      proposedBy: planner/inline-plan-draft@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    spec:
      rationale: Demonstrate that a real command Gate fails closed and passes after the input is repaired.
      nodes:
        - id: NODE-write-artifact
          nodeType: bounded_task
          objective: Write the deterministic goal artifact inside the governed workspace.
          claimRefs:
            - CLM-WRITE-ARTIFACT
          dependsOn: []
          inputRefs:
            - input/m1-command-gate-demo@sha256:7777777777777777777777777777777777777777777777777777777777777777
          expectedOutputs:
            - name: deterministic-artifact
              schemaRef: schema/m1-deterministic-artifact@sha256:8888888888888888888888888888888888888888888888888888888888888888
              consumerNodeRefs:
                - NODE-command-gate
                - NODE-goal-verification
              artifactRequired: true
          capabilityRequests:
            - capability: filesystem.write
              resources:
                - outputs/summary.txt
          gateRefs:
            - GATE-write-artifact
          runtimeRef: runtime/local-goal@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          budgetRequest:
            maxModelCalls: 1
            maxToolCalls: 1
            maxSpawnedNodes: 0
            maxWallSeconds: 30
            maxCostUsd: 0.0
          retryPolicy:
            maxAttempts: 1
            retryableFailureClasses: []
            idempotencyKeyRequired: true
          timeoutSeconds: 30
          sideEffect: idempotent
        - id: NODE-command-gate
          nodeType: gate_verification
          objective: Run the real command Gate against the workspace sentinel file.
          claimRefs:
            - CLM-COMMAND-GATE
          dependsOn:
            - NODE-write-artifact
          inputRefs:
            - inputs/command-gate.txt
            - NODE-write-artifact
          expectedOutputs: []
          capabilityRequests:
            - capability: process.exec
              resources:
                - 'python -c from pathlib import Path; path = Path("inputs/command-gate.txt"); text = path.read_text(encoding="utf-8").strip() if path.exists() else ""; print("COMMAND_GATE_OK" if text == "fixed" else "COMMAND_GATE_BAD:" + (text or "missing")); raise SystemExit(0 if text == "fixed" else 1)'
          gateRefs:
            - GATE-command-sentinel
          runtimeRef: runtime/local-goal@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          budgetRequest:
            maxModelCalls: 1
            maxToolCalls: 1
            maxSpawnedNodes: 0
            maxWallSeconds: 30
            maxCostUsd: 0.0
          retryPolicy:
            maxAttempts: 1
            retryableFailureClasses: []
            idempotencyKeyRequired: true
          timeoutSeconds: 30
          sideEffect: idempotent
        - id: NODE-goal-verification
          nodeType: goal_verification
          objective: Verify all command Gate demonstration claims.
          claimRefs:
            - CLM-WRITE-ARTIFACT
            - CLM-COMMAND-GATE
            - CLM-GOAL-COMPLETE
          dependsOn:
            - NODE-command-gate
          inputRefs:
            - NODE-write-artifact
            - NODE-command-gate
          expectedOutputs: []
          capabilityRequests: []
          gateRefs:
            - GATE-goal-complete
          runtimeRef: runtime/local-goal@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          budgetRequest:
            maxModelCalls: 1
            maxToolCalls: 1
            maxSpawnedNodes: 0
            maxWallSeconds: 30
            maxCostUsd: 0.0
          retryPolicy:
            maxAttempts: 1
            retryableFailureClasses: []
            idempotencyKeyRequired: false
          timeoutSeconds: 30
          sideEffect: idempotent
          terminalGoalVerification: true
