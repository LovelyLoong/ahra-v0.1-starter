  goal:
    goalRef: GOAL-DOGFOOD-A-001
    goalDigest: sha256:aaaa1111bbbb2222cccc3333dddd4444eeee5555ffff6666aaaa7777bbbb8888
    claimGraphRef: claim-graph/dogfood-a-001
    claimGraphDigest: sha256:bbbb2222cccc3333dddd4444eeee5555ffff6666aaaa7777bbbb8888cccc9999
