      proposedBy: planner/inline-plan-draft@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    spec:
      rationale: |
        Workflow A v2, step 1 of 3 (ADR-0010). Per work/tasks/TASK-0092/task.md:
        Human Gate 1 must freeze a typed boundary contract (must / must_not /
        completion_signal / free_zone / open_question entries with unique IDs)
        instead of prose. Declared filesystem.write resources are the
        request-scoped allowlist.
      nodes:
        - id: NODE-task-0092
          nodeType: bounded_task
          objective: |
            Implement TASK-0092 acceptance criteria. 1) Add
            contracts/schemas/boundary-contract.schema.json defining the five
            typed entry kinds (must, must_not, completion_signal, free_zone,
            open_question) with required unique entry IDs, register it plus an
            example record examples/records/boundary-contract.json in
            scripts/lint_contracts.py so lint accepts them. 2) Add
            src/ahra/boundary_contract.py with frozen domain objects that parse
            and validate a boundary contract; freeze validation must reject
            contracts containing open_question entries, duplicate entry IDs, or
            unknown kinds; cover with tests/test_boundary_contract.py. 3) In
            src/ahra/alignment_session.py, make the Human Gate 1 freeze path
            record the typed boundary contract and its sha256 digest in the
            immutable session snapshot, keeping the prose requirement as trace
            only; cover with tests/test_alignment_session.py. Run
            uv run python -B scripts/check.py and record it in
            WorkReport.verification_commands_run.
          claimRefs:
            - CLM-TASK-0092
          dependsOn: []
          inputRefs:
            - input/loop-0092@sha256:0092cccc0092dddd0092eeee0092ffff0092aaaa0092bbbb0092cccc0092dddd
          expectedOutputs:
            - name: boundary-contract-change
              schemaRef: ahra/artifact/code-change/0.1
              consumerNodeRefs:
                - NODE-goal-verification
              artifactRequired: true
          capabilityRequests:
            - capability: filesystem.write
              resources:
                - contracts/schemas/boundary-contract.schema.json
                - examples/records/boundary-contract.json
                - scripts/lint_contracts.py
                - src/ahra/boundary_contract.py
                - src/ahra/alignment_session.py
                - tests/test_boundary_contract.py
                - tests/test_alignment_session.py
            - capability: process.exec
              resources:
                - uv run python -B scripts/check.py
          gateRefs:
            - GATE-task-0092
            - GATE-task-0092-semantic-review
          runtimeRef: runtime/local-goal@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          budgetRequest:
            maxModelCalls: 10
            maxToolCalls: 50
            maxSpawnedNodes: 0
            maxWallSeconds: 2100
            maxCostUsd: 1.0
          retryPolicy:
            maxAttempts: 1
            retryableFailureClasses: []
            idempotencyKeyRequired: true
          timeoutSeconds: 2100
          sideEffect: mutating
        - id: NODE-goal-verification
          nodeType: goal_verification
          objective: Verify the boundary-contract schema, domain objects, and Gate 1 freeze semantics are present and consistent.
          claimRefs:
            - CLM-TASK-0092
