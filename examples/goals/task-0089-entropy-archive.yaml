  planDraft:
    apiVersion: ahra.dev/v1alpha1
    kind: PlanDraft
    metadata:
      goalId: GOAL-LOOP-0089
      proposedBy: planner/inline-plan-draft@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    spec:
      rationale: |
        Self-hosting loop, Increment F / Phase R. Physically archive completed
        tasks and superseded documents per work/tasks/TASK-0089/task.md. Moves
        rely on the TASK-0085 deletion/rename propagation; Git history remains
        the audit authority. Declared filesystem.write resources are the
        request-scoped allowlist admitted by TASK-0085.
      nodes:
        - id: NODE-task-0089
          nodeType: bounded_task
          objective: |
            Reduce default-context entropy per work/tasks/TASK-0089/task.md:
            1. Move completed task directories work/tasks/TASK-0001 through
               work/tasks/TASK-0080 to archive/work/tasks/ unmodified
               (state.json and events.jsonl byte-identical; do not rewrite any
               event history).
            2. Rewrite work/index.md to list only live tasks (TASK-0081 and
               later) plus a one-line digest table of archived tasks with
               their final state and a pointer to archive/work/tasks/.
            3. Move documents whose docs/architecture/authority-map.md status
               is superseded or archived to archive/docs/ and update the
               authority map and docs/index.md so every remaining active owner
               path resolves and archived material is trace-only.
            4. Run uv run python -B scripts/check.py --lint and record it in
               WorkReport.verification_commands_run; every remaining relative
               link must resolve.
          claimRefs:
            - CLM-TASK-0089
          dependsOn: []
          inputRefs:
            - input/loop-0089@sha256:0089cccc0089dddd0089eeee0089ffff0089aaaa0089bbbb0089cccc0089dddd
          expectedOutputs:
            - name: entropy-archive-change
              schemaRef: ahra/artifact/doc-change/0.1
              consumerNodeRefs:
                - NODE-goal-verification
              artifactRequired: true
          capabilityRequests:
            - capability: filesystem.write
              resources:
                - work/**
                - archive/**
                - docs/**
            - capability: process.exec
              resources:
                - uv run python -B scripts/check.py --lint
          gateRefs:
            - GATE-task-0089
            - GATE-task-0089-semantic-review
          runtimeRef: runtime/local-goal@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          budgetRequest:
            maxModelCalls: 10
            maxToolCalls: 50
            maxSpawnedNodes: 0
            maxWallSeconds: 2100
            maxCostUsd: 1.0
          retryPolicy:
            maxAttempts: 1
            retryableFailureClasses: []
            idempotencyKeyRequired: true
          timeoutSeconds: 2100
          sideEffect: mutating
        - id: NODE-goal-verification
          nodeType: goal_verification
          objective: Verify the archive moves, index digest, and authority-map updates are present and consistent.
          claimRefs:
            - CLM-TASK-0089
            - CLM-GOAL-COMPLETE
          dependsOn:
            - NODE-task-0089
          inputRefs:
            - NODE-task-0089
          expectedOutputs: []
          capabilityRequests: []
          gateRefs:
            - GATE-goal-complete
          runtimeRef: runtime/local-goal@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          budgetRequest:
            maxModelCalls: 1
            maxToolCalls: 1
            maxSpawnedNodes: 0
            maxWallSeconds: 60
            maxCostUsd: 0.0
          retryPolicy:
            maxAttempts: 1
            retryableFailureClasses: []
            idempotencyKeyRequired: false
          timeoutSeconds: 60
          sideEffect: idempotent
          terminalGoalVerification: true
